id: book-one
title: Книга перша
# Книга — це впорядкований список глав. Глава — ланцюжок у цій же папці.
# Сходинка глави — одна історія: одне питання, один розділ тексту.
#
# ПЕРЕТАСУВАТИ КНИГУ = ПЕРЕСТАВИТИ РЯДКИ ТУТ. Більше нічого правити не треба:
# кожна глава автоматично спирається на все, що пройдено в главах до неї.
# Тому в самих главах `follows:` не потрібне — воно лишається тільки для
# ланцюжків, які в книгу не входять.
target: [60, 100]
chapters:
  - strange-moves-in
  # «Коло на подушках» стоїть другим не випадково: нульова історія починається
  # з «у ньому було добре кричати», і цю обіцянку виконує саме ця глава.
  # Якщо поїздка має бути раніше — поміняти два рядки місцями.
  - round-on-the-pillows
  - car-trip
