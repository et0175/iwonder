name: check

on:
  push:
  pull_request:

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate every concept graph
        run: npm run check
      - name: Build the site
        run: node tools/build.mjs
